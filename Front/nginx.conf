server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the static bundle
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # basic hardening headers for the SPA and the proxied API
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # the CSV import is capped at 5 MB by the backend; leave a little headroom
    client_max_body_size 6m;

    # Proxy API calls to the FastAPI backend. The /api prefix is preserved
    # because proxy_pass has no path component. `backend` resolves via the
    # docker-compose service name on the shared network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Money Manager backups (.mmbak) are capped at 20 MB by the backend
    # (MMBAK_MAX_UPLOAD_BYTES); only this endpoint gets the bigger body limit
    location /api/import/ {
        client_max_body_size 21m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # the service worker and manifest must be re-checked on every load so a new
    # deploy is picked up; hashed /assets files can be cached for good
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: every non-file route serves index.html so client-side
    # routing (react-router) handles /overview, /settings, etc. on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
